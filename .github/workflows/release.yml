name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Published release"; then
            VERSION=$(echo "$OUTPUT" | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+')
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (latest, includes semantic-release commit)
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install pinned secret scanner
        run: |
          bash scripts/security/install-gitleaks.sh "$RUNNER_TEMP/guard-bin"
          echo "$RUNNER_TEMP/guard-bin" >> "$GITHUB_PATH"

      # Both packages are prepared before either upload. No per-version approval.
      - name: Check exact manifests and scan actual npm tarballs
        id: package_gate
        run: |
          python3 scripts/security/test_guards.py
          node --test scripts/security/recovery.test.mjs
          python3 scripts/security/release.py prepare --package twitterapi-io-mcp --output "$RUNNER_TEMP/main-package"
          python3 scripts/security/release.py prepare --package twitterapi-docs-mcp --output "$RUNNER_TEMP/wrapper-package"

      - name: Require owner review after a previous release block
        id: recovery
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const main = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'main-package/manifest.json')));
            const wrapper = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'wrapper-package/manifest.json')));
            const { pathToFileURL } = require('url');
            const { approvalCommand, ownerApproved } = await import(pathToFileURL(path.resolve('scripts/security/recovery.mjs')));
            const approval = approvalCommand(main, wrapper);
            await core.summary.addHeading('Checked artifact recovery approval').addCodeBlock(approval).write();
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100});
            const blocked = issues.filter(i => !i.pull_request && i.title === 'Release blocked: package safety check');
            for (const issue of blocked) {
              const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: issue.number, per_page: 100});
              if (!ownerApproved(comments, context.repo.owner, approval)) {
                core.setFailed(`Owner approval of this commit and both artifact digests is required in issue #${issue.number}.`);
                return;
              }
            }
            core.setOutput('issues', JSON.stringify(blocked.map(i => i.number)));

      - name: Publish checked npm artifacts
        run: |
          for item in 'twitterapi-io-mcp main-package' 'twitterapi-docs-mcp wrapper-package'; do
            read -r package artifact <<< "$item"
            version=$(node -p "require(process.env.RUNNER_TEMP + '/$artifact/manifest.json').version")
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version already published; skipping."
            else
              python3 scripts/security/release.py publish --package "$package" --output "$RUNNER_TEMP/$artifact"
            fi
          done

      - name: Notify owner when release gate blocks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Release blocked: package safety check';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `@${context.repo.owner} Automatic npm release stopped. Review the allowlist/secret gate or infrastructure failure before retrying. No credential values are included. Run: ${url}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

      - name: Close explicitly approved recovery after successful upload
        if: success() && steps.recovery.outputs.issues != '[]'
        uses: actions/github-script@v7
        env:
          RECOVERED_ISSUES: ${{ steps.recovery.outputs.issues }}
        with:
          script: |
            for (const number of JSON.parse(process.env.RECOVERED_ISSUES || '[]')) {
              await github.rest.issues.update({...context.repo, issue_number: number, state: 'closed'});
            }

  publish-registry:
    needs: [release, publish-npm]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_URL: https://registry.modelcontextprotocol.io
      REGISTRY_AUDIENCE: https://registry.modelcontextprotocol.io
      SERVER_JSON_PATH: server.json
    steps:
      - name: Checkout (latest, includes semantic-release commit)
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Publish server.json to registry
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$SERVER_JSON_PATH" ]; then
            echo "server.json not found" >&2; exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC env missing" >&2; exit 1
          fi

          refresh_registry_token() {
            OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY_AUDIENCE}"
            OIDC_BODY_FILE="$(mktemp)"
            OIDC_STATUS="$(curl -sS -o "$OIDC_BODY_FILE" -w "%{http_code}" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$OIDC_URL")"
            if [ "$OIDC_STATUS" != "200" ]; then
              echo "OIDC token request failed: HTTP ${OIDC_STATUS}" >&2; cat "$OIDC_BODY_FILE" >&2; exit 1
            fi
            OIDC_TOKEN="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(d.value||'');" "$OIDC_BODY_FILE")"
            if [ -z "$OIDC_TOKEN" ]; then echo "No OIDC token" >&2; exit 1; fi
            REGISTRY_BODY_FILE="$(mktemp)"
            REGISTRY_STATUS="$(curl -sS -o "$REGISTRY_BODY_FILE" -w "%{http_code}" -H "Content-Type: application/json" -d "{\"oidc_token\":\"$OIDC_TOKEN\"}" "$REGISTRY_URL/v0.1/auth/github-oidc")"
            if [ "$REGISTRY_STATUS" != "200" ]; then
              echo "Registry exchange failed: HTTP ${REGISTRY_STATUS}" >&2; cat "$REGISTRY_BODY_FILE" >&2; exit 1
            fi
            REGISTRY_TOKEN="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(d.registry_token||'');" "$REGISTRY_BODY_FILE")"
            if [ -z "$REGISTRY_TOKEN" ]; then echo "No registry token" >&2; exit 1; fi
            echo "::add-mask::$REGISTRY_TOKEN"
          }

          refresh_registry_token
          RESPONSE_FILE="$(mktemp)"
          MAX_ATTEMPTS=40
          RETRY_DELAY_SECONDS=15

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS_CODE="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $REGISTRY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@${SERVER_JSON_PATH}" \
              "$REGISTRY_URL/v0.1/publish")"

            if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "409" ]; then
              break
            fi

            # Registry JWTs can expire while waiting for npm package visibility.
            if [ "$STATUS_CODE" = "401" ] && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Registry token expired or rejected; refreshing (${ATTEMPT}/${MAX_ATTEMPTS})"
              refresh_registry_token
              continue
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && { \
              { [ "$STATUS_CODE" = "400" ] && grep -q "was not found" "$RESPONSE_FILE"; } || \
              [ "$STATUS_CODE" = "429" ] || \
              [ "$STATUS_CODE" -ge "500" ]; \
            }; then
              echo "Registry publish not ready (HTTP ${STATUS_CODE}); retrying in ${RETRY_DELAY_SECONDS}s (${ATTEMPT}/${MAX_ATTEMPTS})"
              sleep "$RETRY_DELAY_SECONDS"
              continue
            fi

            echo "Registry publish failed: HTTP ${STATUS_CODE}" >&2
            cat "$RESPONSE_FILE" >&2
            exit 1
          done

          if [ "$STATUS_CODE" = "409" ]; then
            echo "::warning::Version already registered (409 Conflict) — skipping"
          fi
          cat "$RESPONSE_FILE" | tee registry-response.json
