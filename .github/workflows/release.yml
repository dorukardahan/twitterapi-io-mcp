name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Published release"; then
            VERSION=$(echo "$OUTPUT" | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+')
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (latest, includes semantic-release commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (required for automation token compatibility)
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Publish twitterapi-io-mcp to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "Publishing twitterapi-io-mcp@$VERSION"

          if npm view twitterapi-io-mcp@"$VERSION" version >/dev/null 2>&1; then
            echo "twitterapi-io-mcp@$VERSION already published; skipping."
            exit 0
          fi

          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN."
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public
          else
            echo "Publishing with OIDC trusted publishing."
            npm publish --provenance --access public
          fi

      - name: Publish legacy wrapper (twitterapi-docs-mcp)
        working-directory: packages/twitterapi-docs-mcp
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view twitterapi-docs-mcp@"$VERSION" version >/dev/null 2>&1; then
            echo "twitterapi-docs-mcp@$VERSION already published; skipping."
            exit 0
          fi
          NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public

  publish-registry:
    needs: [release, publish-npm]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_URL: https://registry.modelcontextprotocol.io
      REGISTRY_AUDIENCE: mcp-registry
      SERVER_JSON_PATH: server.json
    steps:
      - name: Checkout (latest, includes semantic-release commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Exchange GitHub OIDC token for registry JWT
        id: exchange
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$SERVER_JSON_PATH" ]; then
            echo "server.json not found" >&2; exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC env missing" >&2; exit 1
          fi
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY_AUDIENCE}"
          OIDC_BODY_FILE="$(mktemp)"
          OIDC_STATUS="$(curl -sS -o "$OIDC_BODY_FILE" -w "%{http_code}" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$OIDC_URL")"
          if [ "$OIDC_STATUS" != "200" ]; then
            echo "OIDC token request failed: HTTP ${OIDC_STATUS}" >&2; cat "$OIDC_BODY_FILE" >&2; exit 1
          fi
          OIDC_TOKEN="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(d.value||'');" "$OIDC_BODY_FILE")"
          if [ -z "$OIDC_TOKEN" ]; then echo "No OIDC token" >&2; exit 1; fi
          REGISTRY_BODY_FILE="$(mktemp)"
          REGISTRY_STATUS="$(curl -sS -o "$REGISTRY_BODY_FILE" -w "%{http_code}" -H "Content-Type: application/json" -d "{\"oidc_token\":\"$OIDC_TOKEN\"}" "$REGISTRY_URL/v0.1/auth/github-oidc")"
          if [ "$REGISTRY_STATUS" != "200" ]; then
            echo "Registry exchange failed: HTTP ${REGISTRY_STATUS}" >&2; cat "$REGISTRY_BODY_FILE" >&2; exit 1
          fi
          REGISTRY_TOKEN="$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(d.registry_token||'');" "$REGISTRY_BODY_FILE")"
          if [ -z "$REGISTRY_TOKEN" ]; then echo "No registry token" >&2; exit 1; fi
          echo "::add-mask::$REGISTRY_TOKEN"
          echo "registry_token=$REGISTRY_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish server.json to registry
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          STATUS_CODE="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.exchange.outputs.registry_token }}" \
            -H "Content-Type: application/json" \
            --data-binary "@${SERVER_JSON_PATH}" \
            "$REGISTRY_URL/v0.1/publish")"
          if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "409" ]; then
            echo "Registry publish failed: HTTP ${STATUS_CODE}" >&2; cat "$RESPONSE_FILE" >&2; exit 1
          fi
          if [ "$STATUS_CODE" = "409" ]; then
            echo "::warning::Version already registered (409 Conflict) — skipping"
          fi
          cat "$RESPONSE_FILE" | tee registry-response.json
